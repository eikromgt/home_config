set -g allow-passthrough on
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g status-right "%Y-%m-%d %H:%M"

set -g history-limit 200000

setw -g window-status-format "#I:#W"
setw -g window-status-current-format "#I:#W"
setw -g window-status-current-style "fg=default,bg=cyan"

set-option -g mode-keys vi

unbind C-b
set -g prefix M-t
bind-key M-t send-prefix

bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

bind-key -r h select-pane -L
bind-key -r j select-pane -D
bind-key -r k select-pane -U
bind-key -r l select-pane -R

bind-key -r M-h resize-pane -L 5
bind-key -r M-j resize-pane -D 5
bind-key -r M-k resize-pane -U 5
bind-key -r M-l resize-pane -R 5

bind-key 0 if-shell "tmux list-windows -F '##{window_index}' | grep -qx '0'" "select-window -t 0" "new-window -t 0"
bind-key 1 if-shell "tmux list-windows -F '##{window_index}' | grep -qx '1'" "select-window -t 1" "new-window -t 1"
bind-key 2 if-shell "tmux list-windows -F '##{window_index}' | grep -qx '2'" "select-window -t 2" "new-window -t 2"
bind-key 3 if-shell "tmux list-windows -F '##{window_index}' | grep -qx '3'" "select-window -t 3" "new-window -t 3"
bind-key 4 if-shell "tmux list-windows -F '##{window_index}' | grep -qx '4'" "select-window -t 4" "new-window -t 4"
bind-key 5 if-shell "tmux list-windows -F '##{window_index}' | grep -qx '5'" "select-window -t 5" "new-window -t 5"
bind-key 6 if-shell "tmux list-windows -F '##{window_index}' | grep -qx '6'" "select-window -t 6" "new-window -t 6"
bind-key 7 if-shell "tmux list-windows -F '##{window_index}' | grep -qx '7'" "select-window -t 7" "new-window -t 7"
bind-key 8 if-shell "tmux list-windows -F '##{window_index}' | grep -qx '8'" "select-window -t 8" "new-window -t 8"
bind-key 9 if-shell "tmux list-windows -F '##{window_index}' | grep -qx '9'" "select-window -t 9" "new-window -t 9"
